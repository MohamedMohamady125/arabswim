<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // "web.app." (FQDN trailing dot) is a different origin and breaks CORS
      // against the API — hop to the dotless host before the app boots.
      if (location.hostname.endsWith('.')) {
        location.replace(
          location.href.replace('//' + location.hostname, '//' + location.hostname.slice(0, -1))
        )
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArabSwiM — the Arab swimming database. Every result, every record, every swimmer." />
    <title>ArabSwiM — Arab Swimming Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
